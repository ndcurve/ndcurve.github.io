<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisdom Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        #quote {
            font-size: 1.5rem;
            font-style: italic;
            color: #333;
            margin-bottom: 25px;
            min-height: 80px;
        }
        button {
            padding: 12px 24px;
            font-size: 1rem;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <p id="quote">Click the button to generate wisdom...</p>
        <button onclick="displayWisdom()">Generate Wisdom</button>
    </div>

    <script>
        function generateWisdom() {
            const starts = ["Wholeness", "Perception", "Infinity", "The soul", "Consciousness", "Pure awareness", "Your movement"];
            const verbs = ["transcends", "nurtures", "enlivens", "explores", "hidden within", "gives rise to", "manifests"];
            const objects = ["infinite potentiality", "cosmic destiny", "quantum vibrations", "the unmanifest", "eternal stillness", "the self"];

            const randomStart = starts[Math.floor(Math.random() * starts.length)];
            const randomVerb = verbs[Math.floor(Math.random() * verbs.length)];
            const randomObject = objects[Math.floor(Math.random() * objects.length)];

            return `${randomStart} ${randomVerb} ${randomObject}.`;
        }

        function displayWisdom() {
            document.getElementById("quote").innerText = generateWisdom();
        }
    </script>

</body>
</html>
